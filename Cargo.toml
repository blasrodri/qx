[workspace]
members = [
    "crates/qx-model",
    "crates/qx-quant",
    "crates/qx-compiler",
    "crates/qx-metal",
    "crates/qx-runtime",
    "crates/qx-runtime-v2",
    "crates/qx-format",
    "crates/qx-safetensors",
    "crates/qx-tokenizer",
    "crates/qx-eval",
    "tools/qx-inspect",
    "tools/qx-compile",
    "tools/qx-bench",
    "tools/qx-parity",
    "tools/qx-sensitivity",
    "tools/qx-generate",
    "tools/qx-autotune",
    "tools/qx-fixture",
    "tools/qx-validate",
    "tools/qx-quality",
    "tools/qx-quality-corpus",
    "tools/qx-task-eval",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
half = { version = "2", features = ["serde"] }
libc = "0.2"
memmap2 = "0.9"
qx-format = { path = "crates/qx-format" }
qx-compiler = { path = "crates/qx-compiler" }
qx-metal = { path = "crates/qx-metal" }
qx-model = { path = "crates/qx-model" }
qx-quant = { path = "crates/qx-quant" }
qx-runtime = { path = "crates/qx-runtime" }
qx-runtime-v2 = { path = "crates/qx-runtime-v2" }
qx-safetensors = { path = "crates/qx-safetensors" }
qx-tokenizer = { path = "crates/qx-tokenizer" }
qx-eval = { path = "crates/qx-eval" }
regex = "1"
rayon = "1"
safetensors = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
