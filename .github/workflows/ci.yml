name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check workspace
        run: cargo check --workspace
      - name: Test consensus and commitment crates
        run: cargo test -p qx-commit -p qx-consensus-math -p qx-verifier-core
