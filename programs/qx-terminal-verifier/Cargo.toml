[package]
name = "qx-terminal-verifier"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
half = { version = "2", default-features = false }
solana-blake3-hasher = "3.1.0"
solana-program = "4.0.0"
solana-sha256-hasher = "3.1.0"
qx-consensus-math = { path = "../../crates/qx-consensus-math" }

[dev-dependencies]
ed25519-dalek = "=2.1.1"
mollusk-svm = { version = "=0.13.0", features = ["precompiles"] }
qx-commit = { path = "../../crates/qx-commit" }
qx-verifier-core = { path = "../../crates/qx-verifier-core" }
solana-account = "=3.4.0"
solana-ed25519-program = "3.0.0"
solana-hash = "=4.2.0"
solana-instruction = "=3.3.0"
solana-pubkey = "=4.1.0"
solana-slot-hashes = "=3.0.1"
solana-sdk-ids = "=3.1.0"
